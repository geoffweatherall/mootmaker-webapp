<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100" height="90" role="img" aria-label="A calendar card with a plus badge and a small clock">
  <circle cx="50" cy="46" r="40" fill="#efe9fb" />

  <!-- Calendar card -->
  <rect x="24" y="20" width="46" height="52" rx="10" fill="#faf9f6" stroke="#e7e3f6" stroke-width="2" />
  <rect x="24" y="20" width="46" height="16" rx="10" fill="#4338ca" />
  <rect x="24" y="28" width="46" height="8" fill="#4338ca" />
  <line x1="33" y1="50" x2="53" y2="50" stroke="#e7e3f6" stroke-width="4" stroke-linecap="round" />
  <line x1="33" y1="60" x2="47" y2="60" stroke="#e7e3f6" stroke-width="4" stroke-linecap="round" />

  <!-- Plus badge -->
  <circle cx="68" cy="58" r="15" fill="#f59e0b" />
  <path d="M68 51 v14 M61 58 h14" stroke="#faf9f6" stroke-width="4.4" stroke-linecap="round" />

  <!-- Small clock -->
  <circle cx="22" cy="66" r="11" fill="#faf9f6" stroke="#0e8f82" stroke-width="3.4" />
  <line x1="22" y1="66" x2="22" y2="59" stroke="#1e1b2e" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="66" x2="27" y2="66" stroke="#1e1b2e" stroke-width="2" stroke-linecap="round" />
</svg>
