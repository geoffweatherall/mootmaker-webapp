  <rect x="95" y="26" width="72" height="106" rx="10" fill="none" stroke="#b6b0d8" stroke-width="6" />
  <circle cx="152" cy="80" r="3.4" fill="#b6b0d8" />

  <!-- Hanging sign -->
  <line x1="131" y1="26" x2="131" y2="46" stroke="#0e8f82" stroke-width="3" stroke-linecap="round" />
  <rect x="111" y="46" width="40" height="30" rx="8" fill="#0e8f82" />
  <circle cx="131" cy="61" r="8" fill="#2dd4bf" />

