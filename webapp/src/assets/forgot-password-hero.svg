<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150" role="img" aria-label="A magnifying glass examining a locked padlock with a question mark">
  <circle cx="100" cy="78" r="66" fill="#fdf1dc" />

  <!-- Padlock (closed) -->
  <path d="M84 62 v-12 a16 16 0 0 1 32 0 v12" fill="none" stroke="#0e8f82" stroke-width="9" stroke-linecap="round" />
  <rect x="76" y="62" width="48" height="42" rx="10" fill="#4338ca" />
  <circle cx="100" cy="80" r="6" fill="#faf9f6" />
  <rect x="97" y="84" width="6" height="12" rx="3" fill="#faf9f6" />

  <!-- Question mark -->
  <text x="146" y="66" font-family="Outfit, Inter, sans-serif" font-size="34" font-weight="700" fill="#f59e0b">?</text>

  <!-- Magnifying glass -->
  <circle cx="60" cy="108" r="20" fill="none" stroke="#1e1b2e" stroke-width="7" />
  <line x1="74" y1="122" x2="88" y2="136" stroke="#1e1b2e" stroke-width="8" stroke-linecap="round" />
  <circle cx="60" cy="108" r="20" fill="#faf9f6" fill-opacity="0.5" />
</svg>
