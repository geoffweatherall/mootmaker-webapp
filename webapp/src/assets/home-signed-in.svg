  <!-- Wall calendar board -->
  <rect x="255" y="55" width="150" height="175" rx="18" fill="#faf9f6" stroke="#e7e3f6" stroke-width="2" />
  <rect x="255" y="55" width="150" height="34" rx="18" fill="#4338ca" />
  <rect x="255" y="71" width="150" height="18" fill="#4338ca" />
  <circle cx="330" cy="90" r="7" fill="#faf9f6" />
  <rect x="275" y="105" width="110" height="8" rx="4" fill="#e7e3f6" />
  <rect x="275" y="122" width="80" height="8" rx="4" fill="#e7e3f6" />
  <circle cx="330" cy="168" r="30" fill="#f59e0b" />
  <path d="M317 168 L326 178 L345 156" fill="none" stroke="#faf9f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="278" y="205" width="60" height="8" rx="4" fill="#e7e3f6" />

  <!-- Figure (teal pairing), one arm raised in a wave -->
  <path d="M182 190 Q145 165 150 128" fill="none" stroke="#0e8f82" stroke-width="20" stroke-linecap="round" />
  <circle cx="150" cy="128" r="13" fill="#0e8f82" />
  <path d="M104 205 Q95 165 118 148" fill="none" stroke="#0e8f82" stroke-width="18" stroke-linecap="round" />
  <circle cx="118" cy="148" r="11" fill="#0e8f82" />
  <rect x="105" y="180" width="98" height="108" rx="48" fill="#0e8f82" />
  <circle cx="153" cy="156" r="38" fill="#2dd4bf" />
  <circle cx="141" cy="153" r="2.8" fill="#1e1b2e" />
  <circle cx="165" cy="153" r="2.8" fill="#1e1b2e" />
  <path d="M143 167 Q153 174 163 167" fill="none" stroke="#1e1b2e" stroke-width="2.4" stroke-linecap="round" />

  <!-- Small floating sparkle, echoing SparkleIcon -->
  <path
    d="M415 175 C415.5 180 416 182.5 421 183 C416 183.5 415.5 186 415 191 C414.5 186 414 183.5 409 183 C414 182.5 414.5 180 415 175 Z"
